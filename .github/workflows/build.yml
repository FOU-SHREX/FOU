name: Build FOU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Build FOU
        run: python -m PyInstaller --clean --onefile --name FOU main.py

      - name: Package Unix build
        if: runner.os != 'Windows'
        run: tar -czf FOU-${{ runner.os }}.tar.gz -C dist FOU

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FOU-windows-latest
          path: dist/FOU.exe

      - name: Upload Unix build
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FOU-${{ matrix.os }}
          path: FOU-${{ runner.os }}.tar.gz